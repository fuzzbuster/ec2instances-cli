name: Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
            - name: Check
              run: make check
