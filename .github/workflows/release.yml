name: Release

on:
    push:
        tags:
            - "scraper-v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
            - name: Validate tag
              shell: bash
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^scraper-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Invalid release tag: $GITHUB_REF_NAME" >&2
                      exit 1
                  fi
            - name: Build archives
              run: make release-archives
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="${GITHUB_REF_NAME#scraper-v}"
                  gh release create "$GITHUB_REF_NAME" \
                      dist/*.tar.gz dist/checksums.txt \
                      --title "ec2instances $version" \
                      --generate-notes
