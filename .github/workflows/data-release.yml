name: Monthly Data Release

on:
    schedule:
        - cron: "0 0 15 * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: monthly-data-release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-22.04
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.x"
                  cache: true
            - name: Build CLI
              run: make build-local
            - name: Scrape anonymous providers
              shell: bash
              run: |
                  set -euo pipefail
                  ./ec2instances --json scrape \
                      --providers aws,azure,alicloud,tencentcloud,volcengine,huaweicloud,vultr,linode,digitalocean,hetzner \
                      --output-dir ./output > scrape-result.json
                  cat scrape-result.json
            - name: Validate and package snapshot
              shell: bash
              run: |
                  set -euo pipefail
                  expected_providers='[
                    "aws",
                    "azure",
                    "alicloud",
                    "tencentcloud",
                    "volcengine",
                    "huaweicloud",
                    "vultr",
                    "linode",
                    "digitalocean",
                    "hetzner"
                  ]'
                  jq -e --argjson expected "$expected_providers" '
                    .status == "ok" and
                    .partial == false and
                    (.failed | length == 0) and
                    ((.succeeded | sort) == ($expected | sort))
                  ' scrape-result.json

                  files=(
                      instances.json
                      azure/instances.json
                      alicloud/instances.json
                      tencentcloud/instances.json
                      volcengine/instances.json
                      huaweicloud/instances.json
                      vultr/instances.json
                      linode/instances.json
                      digitalocean/instances.json
                      hetzner/instances.json
                  )
                  for file in "${files[@]}"; do
                      jq -e 'type == "array" and length > 0' "output/$file" >/dev/null
                  done

                  snapshot_date="$(date -u +%Y-%m-%d)"
                  archive="ec2instances-data-${snapshot_date}.tar.gz"
                  mkdir -p dist
                  tar -C output -czf "dist/$archive" "${files[@]}"
                  (cd dist && sha256sum "$archive" > checksums.txt)

                  echo "SNAPSHOT_DATE=$snapshot_date" >> "$GITHUB_ENV"
                  echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
            - name: Publish data release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  notes="$(cat <<EOF
                  Anonymous cloud instance data snapshot for ${SNAPSHOT_DATE}.

                  Providers: AWS, Azure, Alibaba Cloud, Tencent Cloud, Volcengine, Huawei Cloud, Vultr, Linode, DigitalOcean, and Hetzner.

                  Source commit: ${GITHUB_SHA}
                  EOF
                  )"
                  gh release create "data-${SNAPSHOT_DATE}" \
                      "dist/${ARCHIVE}" dist/checksums.txt \
                      --target "$GITHUB_SHA" \
                      --title "EC2 Instances Data ${SNAPSHOT_DATE}" \
                      --notes "$notes" \
                      --latest=false
